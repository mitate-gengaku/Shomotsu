name: Development CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    types: [opened, reopened, synchronize]

env:
  WORKING_DIRECTORY: "./app"

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.npm-cache.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get cache key
        id: npm-cache
        run: echo "cache-key=npm-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ${{ env.WORKING_DIRECTORY }}/node_modules
          key: ${{ steps.npm-cache.outputs.cache-key }}
          restore-keys: |
            npm-
      - name: Install dependencies
        run: npm ci

  lint:
    needs: setup
    uses: ./.github/workflows/lint.yml
    with:
      working-directory: "./app"
      cache-key: ${{ needs.setup.outputs.cache-key }}

  test:
    needs: [setup, lint]
    uses: ./.github/workflows/test.yml
    with:
      working-directory: "./app"
      cache-key: ${{ needs.setup.outputs.cache-key }}

  deploy:
    needs: [setup, lint, test]
    uses: ./.github/workflows/deploy-dev.yml
    with:
      working-directory: "./app"
      cache-key: ${{ needs.setup.outputs.cache-key }}
    secrets:
      vercel_org_id: ${{ secrets.ORG_ID }}
      vercel_project_id: ${{ secrets.PROJECT_ID }}
      vercel_token: ${{ secrets.VERCEL_TOKEN }}
      clerk_publishable_key: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}